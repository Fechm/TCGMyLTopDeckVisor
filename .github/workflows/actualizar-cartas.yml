name: Actualizar cartas

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      historicas:
        description: "Calcular huellas de todas las temporadas (lento, con pausa entre imágenes)"
        type: boolean
        default: false

concurrency:
  group: actualizar-cartas
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Instalar dependencias
        run: pip install -r requirements-ci.txt

      - name: Cache del modelo
        uses: actions/cache@v4
        with:
          path: spike/modelos
          key: modelo-mobilenetv2-emb-v1

      - name: Preparar modelo
        run: python spike/preparar_modelo.py

      - name: Actualizar Supabase desde Códice
        env:
          SUPABASE_URL: https://nzehvfrlbmltxfqkovtu.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HISTORICAS: ${{ inputs.historicas && '1' || '0' }}
        run: python actualizar_supabase.py
