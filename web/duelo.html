<!doctype html>
<html lang="es">
<head>

<style>
  body.en-duelo { padding: 0; overflow: hidden; height: 100dvh; }
  .portada-duelo { padding: 16px; }
  .tablero {
    --c: min(11.5vw, 54px);
    --c-chica: calc(var(--c) * 0.74);
    --c-oro: calc(var(--c) * 0.62);
    position: fixed; inset: 0 0 calc(var(--nav-alto) + env(safe-area-inset-bottom, 0px)) 0;
    display: grid; grid-template-rows: auto auto auto auto auto auto auto auto auto auto auto 1fr;
    gap: 3px; padding: max(6px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) 0 max(8px, env(safe-area-inset-left, 0px));
    max-width: 760px; margin: 0 auto; overflow: hidden;
  }
  .barra-sup { display: flex; align-items: center; gap: 8px; min-height: 34px; }
  .barra-sup h1 { font-size: 1rem; flex: 1; }
  .barra-sup .boton { min-height: 32px; padding: 0 10px; font-size: 0.82rem; border-radius: 9px; }
  .mano-rival { display: flex; justify-content: center; min-height: calc(var(--c-oro) * 0.9); }
  .mano-rival .carta { margin: 0 calc(var(--c-oro) * -0.28); width: var(--c-oro); }
  .franja { position: relative; display: flex; align-items: center; gap: 4px; min-height: calc(var(--c) * 1.43 + 6px); padding: 3px 6px 3px 22px; border-radius: 8px; border: 1px solid rgb(226 178 77 / 0.14); background: rgb(0 0 0 / 0.16); overflow-x: auto; overflow-y: visible; scrollbar-width: none; }
  .franja::-webkit-scrollbar { display: none; }
  .franja > .rotulo { position: absolute; left: 2px; top: 50%; transform: translateY(-50%) rotate(180deg); writing-mode: vertical-rl; font: 700 0.52rem var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); opacity: 0.75; pointer-events: none; }
  .franja.ataque { background: linear-gradient(90deg, rgb(180 60 40 / 0.16), rgb(180 60 40 / 0.05)); border-color: rgb(232 120 90 / 0.25); }
  .franja.defensa { background: linear-gradient(90deg, rgb(60 90 170 / 0.18), rgb(60 90 170 / 0.05)); border-color: rgb(120 150 230 / 0.25); }
  .franja.apoyo { min-height: calc(var(--c-chica) * 1.43 + 6px); background: linear-gradient(90deg, rgb(60 140 90 / 0.14), rgb(60 140 90 / 0.04)); border-color: rgb(110 190 140 / 0.22); }
  .franja.apoyo .carta { width: var(--c-chica); }
  .franja.recursos { min-height: calc(var(--c-oro) * 1.43 + 8px); gap: 6px; padding-left: 6px; }
  .pila { position: relative; flex: none; width: var(--c-chica); aspect-ratio: 220 / 315; border-radius: 4px; border: 1px dashed rgb(226 178 77 / 0.3); background: rgb(0 0 0 / 0.25); padding: 0; cursor: pointer; color: var(--ink); }
  .pila img, .pila .dorso { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 3px; }
  .pila .cuenta { position: absolute; left: 50%; bottom: -3px; transform: translateX(-50%); font: 700 0.72rem var(--display); background: #120f1c; color: var(--gold-claro); border: 1px solid var(--gold-oscuro); border-radius: 8px; padding: 0 5px; min-width: 20px; text-align: center; font-variant-numeric: tabular-nums; }
  .pila .nombre-pila { position: absolute; top: -1px; left: 50%; transform: translateX(-50%); font: 700 0.4rem var(--body); letter-spacing: 0.02em; text-transform: uppercase; background: rgb(0 0 0 / 0.7); color: var(--muted); padding: 0 3px; border-radius: 3px; white-space: nowrap; }
  .pila.castillo .cuenta { font-size: 0.85rem; color: #fff; background: #3a1f12; }
  .pila.golpe { animation: golpe 0.45s ease; }
  .oros { display: flex; gap: 3px; align-items: center; flex: 1; min-width: 0; padding: 0 4px; border-left: 1px solid var(--line); }
  .oros .carta { width: var(--c-oro); }
  .oros .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 3px; }
  .oros .etq { font: 700 0.48rem var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); writing-mode: vertical-rl; transform: rotate(180deg); }
  .dorso { background: repeating-linear-gradient(45deg, #3a2c58, #3a2c58 3px, #241a3c 3px, #241a3c 6px); border: 1px solid var(--line-fuerte); }
  .carta { position: relative; flex: none; width: var(--c); aspect-ratio: 220 / 315; border-radius: 5px; padding: 0; border: 1px solid rgb(0 0 0 / 0.6); background: var(--surface); cursor: pointer; box-shadow: 0 2px 6px rgb(0 0 0 / 0.5); }
  .carta > img, .carta > .dorso { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 4px; display: block; }
  .carta.pagado > img { filter: grayscale(0.55) brightness(0.55); }
  .carta.pagado { rotate: 90deg; margin: 0 calc(var(--c-oro) * 0.2); }
  .carta.puede { box-shadow: 0 0 0 2px var(--gold), 0 0 12px rgb(226 178 77 / 0.65); }
  .carta.elegida { box-shadow: 0 0 0 3px var(--gold-claro), 0 0 18px rgb(243 214 138 / 0.8); }
  .carta .fz { position: absolute; left: -5px; bottom: -5px; z-index: 2; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 10px; display: grid; place-items: center; font: 700 0.76rem var(--display); background: #2a1810; color: var(--gold-claro); border: 1px solid var(--gold-oscuro); }
  .carta .fz.sube { color: #8be0a8; border-color: #3f8f5f; }
  .carta .fz.baja { color: #f3a07a; border-color: #a0502c; }
  .carta .etiqueta { position: absolute; inset: 1px 1px auto 1px; z-index: 2; font: 700 0.5rem var(--body); text-align: center; background: rgb(0 0 0 / 0.8); color: var(--gold-claro); border-radius: 3px; }
  .carta .portadas { position: absolute; left: 50%; top: 58%; z-index: -1; display: flex; gap: 1px; transform: translateX(-50%); }
  .carta .portadas .carta { width: calc(var(--c) * 0.62); }
  .centro { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; min-height: 40px; }
  .centro .info { display: grid; gap: 1px; font-size: 0.72rem; color: var(--muted); }
  .centro .info b { color: var(--pergamino); font: 700 0.8rem var(--display); letter-spacing: 0.04em; }
  .centro .chip.tuyo { background: var(--gold); color: #23180a; }
  .centro .botones { display: flex; gap: 4px; justify-content: flex-end; flex-wrap: wrap; }
  .centro .boton { min-height: 34px; padding: 0 10px; font-size: 0.8rem; border-radius: 10px; }
  .centro .boton.principal::before, .centro .boton.principal::after { display: none; }
  .escenario { position: fixed; left: 50%; top: 42%; z-index: 20; transform: translate(-50%, -50%); pointer-events: none; display: flex; gap: 10px; }
  .escenario .carta { width: min(30vw, 130px); box-shadow: 0 0 0 2px var(--gold), 0 20px 50px rgb(0 0 0 / 0.7), 0 0 40px rgb(226 178 77 / 0.35); }
  .escenario .carta.anulada > img { filter: grayscale(1) brightness(0.5); }
  .mano { position: relative; display: flex; justify-content: center; align-items: flex-end; padding: 6px 0 4px; min-height: calc(var(--c) * 1.5); }
  .mano .carta { width: calc(var(--c) * 1.18); margin: 0 calc(var(--c) * -0.2); rotate: var(--giro, 0deg); translate: 0 var(--alza, 0px); transform-origin: 50% 120%; transition: translate 0.15s ease, rotate 0.15s ease; }
  .mano .carta.elegida, .mano .carta:focus-visible { translate: 0 -14px; rotate: 0deg; z-index: 5; }
  .aviso { position: fixed; left: 50%; top: 50%; z-index: 22; transform: translate(-50%, -50%); padding: 8px 14px; border-radius: 12px; background: rgb(14 18 32 / 0.92); border: 1px solid var(--line-fuerte); color: var(--pergamino); font: 600 0.9rem var(--body); text-align: center; max-width: 86vw; pointer-events: none; opacity: 0; transition: opacity 0.25s ease; }
  .aviso.visible { opacity: 1; }
  .flota { position: fixed; z-index: 23; font: 700 1.4rem var(--display); color: #ff8a65; text-shadow: 0 2px 8px #000; pointer-events: none; animation: flota 1.1s ease-out forwards; }
  .fantasma { position: fixed; z-index: 21; pointer-events: none; margin: 0; }
  .hoja-fondo { position: fixed; inset: 0; z-index: 25; background: rgb(0 0 0 / 0.55); display: grid; align-items: end; }
  .hoja { max-height: 84dvh; overflow-y: auto; background: linear-gradient(180deg, var(--surface-2), var(--surface)); border-top: 1px solid var(--line-fuerte); border-radius: 16px 16px 0 0; padding: 16px max(16px, env(safe-area-inset-left, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; max-width: 760px; width: 100%; margin: 0 auto; }
  .hoja h2 { font-size: 1.05rem; }
  .hoja .sub { margin-top: -6px; }
  .hoja .opciones { display: grid; gap: 8px; }
  .hoja .boton { white-space: normal; height: auto; min-height: 44px; padding: 8px 14px; line-height: 1.25; text-align: center; font-size: 0.92rem; }
  .hoja .boton.principal { font-family: var(--body); font-weight: 700; letter-spacing: 0; }
  .hoja .boton.principal::before, .hoja .boton.principal::after { display: none; }
  .hoja > * { min-width: 0; }
  .hoja .opciones.cartas { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); }
  .opcion-carta { display: grid; gap: 4px; justify-items: center; padding: 6px; border-radius: 10px; border: 1px solid var(--line); background: rgb(255 255 255 / 0.03); color: var(--ink); font: 600 0.74rem var(--body); cursor: pointer; text-align: center; }
  .opcion-carta img { width: 72px; border-radius: 5px; }
  .detalle-carta { display: grid; grid-template-columns: minmax(120px, 200px) 1fr; gap: 14px; align-items: start; }
  .detalle-carta img { width: 100%; border-radius: 10px; box-shadow: 0 10px 30px rgb(0 0 0 / 0.5); }
  .detalle-carta dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 0.9rem; }
  .detalle-carta dt { color: var(--muted); }
  .detalle-carta dd { margin: 0; }
  .texto-carta { margin: 10px 0 0; font-size: 0.86rem; line-height: 1.4; color: var(--ink); padding: 8px 10px; border-radius: 8px; background: rgb(0 0 0 / 0.25); border: 1px solid var(--line); }
  .grupo-eleccion { display: grid; gap: 6px; padding: 10px; border-radius: 12px; border: 1px solid var(--line); }
  .grupo-eleccion h3 { font: 700 0.8rem var(--display); letter-spacing: 0.08em; text-transform: uppercase; }
  .grupo-eleccion.rivales { background: rgb(160 60 50 / 0.12); border-color: rgb(232 120 90 / 0.3); }
  .grupo-eleccion.rivales h3 { color: #f0a58c; }
  .grupo-eleccion.mias { background: rgb(60 90 170 / 0.12); border-color: rgb(120 150 230 / 0.3); }
  .grupo-eleccion.mias h3 { color: #a9c0f5; }
  .zona-eleccion { margin: 0; font: 600 0.72rem var(--body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .registro { display: grid; gap: 3px; font-size: 0.88rem; }
  .registro p { margin: 0; color: var(--muted); }
  .registro p.yo { color: var(--pergamino); }
  .registro p.ia { color: #c9b3f0; }
  .registro p.sistema { color: var(--gold); }
  @keyframes golpe { 0%, 100% { translate: 0 0; } 20% { translate: -4px 0; } 40% { translate: 4px 0; } 60% { translate: -3px 0; } 80% { translate: 2px 0; } }
  @keyframes flota { from { opacity: 1; translate: 0 0; } to { opacity: 0; translate: 0 -46px; } }
  @media (max-width: 420px) { .detalle-carta { grid-template-columns: 1fr; justify-items: center; } .detalle-carta img { max-width: 220px; } }
  @media (prefers-reduced-motion: reduce) { .mano .carta { transition: none; } }
</style>

<body>
<main class="portada-duelo">
  <section class="portada" id="portada" hidden aria-labelledby="t-portada">
    <img src="logo.png" alt="" width="150" height="196">
    <h2 id="t-portada">Duelo contra la IA</h2>
    <p>Juega una partida completa de Imperio Racial con tu mazo Dragón contra el Caballero de la IA, todo en tu teléfono. Entra a tu cuenta para empezar.</p>
    <div class="acciones">
      <button type="button" class="boton principal" id="portada-crear">Crear cuenta</button>
      <button type="button" class="boton" id="portada-entrar">Ya tengo cuenta</button>
    </div>
  </section>
</main>

<div class="tablero" id="tablero" hidden>
  <div class="barra-sup">

  <div class="franja ataque" id="z-1-ataque"><span class="rotulo">Ataque</span></div>
  <div class="centro">
    <div class="info"><b id="fase">—</b><span id="turno"></span></div>

  <div class="franja ataque" id="z-0-ataque"><span class="rotulo">Ataque</span></div>
  <div class="franja defensa" id="z-0-defensa"><span class="rotulo">Defensa</span></div>
  <div class="franja apoyo" id="z-0-apoyo"><span class="rotulo">Apoyo</span></div>

<div class="escenario" id="escenario" aria-live="polite"></div>

<script type="module">
import { crearPartida, accionesLegales, aplicar, jugadorQueDecide, costeDe } from "./duelo/motor.js";
import { CATALOGO, MAZOS } from "./duelo/cartas.js";
import { elegirAccion, configurar } from "./duelo/bot.js";
import { MODELO } from "./duelo/modelo.js";
import { foto, ajustar, muestrasDePartida } from "./duelo/aprendizaje.js";
import * as N from "./duelo/nucleo.js";

const $ = (id) => document.getElementById(id);
const YO = 0, IA = 1;
const GUARDADO = "duelo-partida";
const MEMORIA = "duelo-aprendizaje";
const PARTIDAS_RECORDADAS = 15;
const PAUSA_IA = 800;
const DURACION = 420;
const SIN_MOVIMIENTO = matchMedia("(prefers-reduced-motion: reduce)").matches;
const CLAVES_VISIBLES = ["Furia", "Indestructible", "Indesterrable", "Imbloqueable", "Exhumar", "AtacaAlEntrar", "DanoAlDestierro", "NoAnulable"];
const NOMBRE_CLAVE = { AtacaAlEntrar: "Ataca al entrar", DanoAlDestierro: "Daño al Destierro", NoAnulable: "No se puede Anular" };
const ZONAS = { castillo: "Castillo", mano: "mano", reserva: "Reserva de Oro", pagado: "Oro Pagado", defensa: "Línea de Defensa", ataque: "Línea de Ataque", apoyo: "Línea de Apoyo", cementerio: "Cementerio", destierro: "Destierro", arma: "portada" };
const FASES = { mulligan: "Mulligan", vigilia: "Vigilia", ataque: "Ataque", bloqueo: "Bloqueo", talismanes: "Guerra de Talismanes", final: "Fase Final", fin: "Fin" };
const PILAS = ["castillo", "cementerio", "destierro"];

let e = null;
let registro = [];
let fotos = [];
let aprendizaje = cargarAprendizaje();
configurar({ modelo: aprendizaje.modelo });
let seleccion = null;
let iaTrabajando = false;
let zonaPrevia = new Map();
const elementos = new Map();
const pilas = {};

const nombre = (uid) => N.carta(e, uid).nombre;
const img = (uid, grande) => `${grande ? "cartas" : "miniaturas"}/${e.instancias[uid]}.jpg`;
const quienDecide = () => (e.pendiente ? e.pendiente.jugador : jugadorQueDecide(e));

function anotar(texto, clase = "") {
  registro.push({ texto, clase });
  if (registro.length > 300) registro = registro.slice(-300);
}

let avisoTimer = null;
function avisar(texto) {
  const a = $("aviso");
  a.textContent = texto;
  a.classList.add("visible");
  clearTimeout(avisoTimer);
  avisoTimer = setTimeout(() => a.classList.remove("visible"), 1400);
}

function cargarAprendizaje() {
  try {
    const m = JSON.parse(localStorage.getItem(MEMORIA) || "null");
    if (m && m.base === MODELO.version) return m;
  } catch (x) {}
  return { base: MODELO.version, modelo: MODELO, recuerdos: [], aprendidas: 0 };
}

function aprender() {
  if (!fotos.length || e.ganador === null) return;
  aprendizaje.recuerdos.push(muestrasDePartida(fotos, e.ganador));
  aprendizaje.recuerdos = aprendizaje.recuerdos.slice(-PARTIDAS_RECORDADAS);
  aprendizaje.modelo = ajustar(aprendizaje.modelo, aprendizaje.recuerdos.flat(), { pasos: 40, tasa: 0.1, l2: 0.3, ancla: MODELO });
  aprendizaje.aprendidas += 1;
  fotos = [];
  configurar({ modelo: aprendizaje.modelo });
  try { localStorage.setItem(MEMORIA, JSON.stringify(aprendizaje)); } catch (x) {}
  anotar(`La IA aprendió de esta partida (${aprendizaje.aprendidas} partida${aprendizaje.aprendidas === 1 ? "" : "s"} contigo en este teléfono).`, "sistema");
}

function fotografiar() {
  if (e.ganador !== null || e.fase !== "vigilia" || e.pendiente) return;
  if (fotos.length && fotos.at(-1).turno === e.turno) return;
  fotos.push({ turno: e.turno, ...foto(e) });
}

function guardar() {
  try {
    const { catalogo, ...resto } = e;
    localStorage.setItem(GUARDADO, JSON.stringify({ e: resto, registro, fotos }));
  } catch (x) {}
}

function cargar() {
  try {
    const g = JSON.parse(localStorage.getItem(GUARDADO) || "null");
    if (!g?.e) return false;
    e = { ...g.e, catalogo: CATALOGO };
    registro = g.registro ?? [];
    fotos = g.fotos ?? [];
    return true;
  } catch (x) {
    return false;
  }
}

function nuevaPartida() {
  const semilla = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
  e = crearPartida({ semilla, mazos: [MAZOS.dragon, MAZOS.caballero] });
  registro = [];
  fotos = [];
  seleccion = null;
  zonaPrevia = new Map();
  for (const el of elementos.values()) el.remove();
  elementos.clear();
  anotar(e.inicial === YO ? "Comienzas tú." : "Comienza la IA.", "sistema");
  avisar(e.inicial === YO ? "Comienzas tú" : "Comienza la IA");
  guardar();
  ciclo();
}

function publica(uid) {
  const u = N.ubicar(e, uid);
  return !u || !["mano", "castillo"].includes(u.zona) || u.j === YO;
}

function describir(accion, quien) {
  const sujeto = quien === YO ? "Tú" : "IA";
  const n = (u) => (e.conv[u] ? `${nombre(u)} (convertida en ${e.conv[u].tipo})` : nombre(u));
  switch (accion.tipo) {
    case "quedarse": return `${sujeto}: se queda con su mano.`;
    case "mulligan": return `${sujeto}: mulligan.`;
    case "mulliganGratis": return `${sujeto}: mulligan gratis.`;
    case "oro": return `${sujeto}: pone ${n(accion.uid)} como Oro.`;
    case "jugar": return `${sujeto}: juega ${n(accion.uid)}${accion.portador ? ` en ${n(accion.portador)}` : ""}${accion.desde === "cementerio" ? " desde el Cementerio" : ""}.`;
    case "habilidad": return `${sujeto}: usa la habilidad de ${N.def(e, accion.def).nombre}.`;
    case "responder": return `${sujeto}: responde con ${n(accion.uid)} para Anular.`;
    case "batalla": return `${sujeto}: inicia la Batalla Mitológica.`;
    case "atacar": return `${sujeto}: ataca con ${n(accion.uid)} (${N.fuerza(e, accion.uid)}).`;
    case "finAtaque": return e.atacantes.length ? null : `${sujeto}: no ataca.`;
    case "bloquear": return `${sujeto}: bloquea a ${n(accion.atacante)} con ${n(accion.uid)}.`;
    case "finBloqueo": return Object.keys(e.bloqueos).length ? null : `${sujeto}: no bloquea.`;
    case "terminar": return `${sujeto}: termina su turno.`;
    case "descartar": return `${sujeto}: descarta ${n(accion.uid)}.`;
    case "elegir": {
      const o = e.pendiente.opciones[accion.i];
      if (o.texto && o.valor !== true && o.valor !== false) return `${sujeto} elige: ${o.texto}.`;
      if (o.valor === true) return `${sujeto}: sí.`;
      if (o.valor === false || o.valor === null) return null;
      if (typeof o.valor === "string") return publica(o.valor) ? `${sujeto} elige ${n(o.valor)}.` : `${sujeto} elige una carta.`;
      return `${sujeto} elige ${o.valor}.`;
    }
    default: return null;
  }
}

function hacer(accion) {
  const quien = quienDecide();
  const texto = describir(accion, quien);
  const combates = e.registro.length;
  try {
    e = aplicar(e, accion);
  } catch (x) {
    anotar(`Error: ${x.message}`, "sistema");
    return;
  }
  if (texto) {
    anotar(texto, quien === YO ? "yo" : "ia");
    if (quien === IA) avisar(texto.replace(/^IA: /, "IA "));
  }
  for (const r of e.registro.slice(combates)) {
    const t = `Combate: ${r.dano} de daño${r.destruidos ? `, ${r.destruidos} Aliado${r.destruidos > 1 ? "s" : ""} destruido${r.destruidos > 1 ? "s" : ""}` : ""}.`;
    anotar(t, "sistema");
    avisar(t);
  }
  fotografiar();
  if (e.ganador !== null) {
    anotar(e.ganador === YO ? "¡Ganaste!" : "La IA gana.", "sistema");
    avisar(e.ganador === YO ? "¡Ganaste!" : "La IA gana");
    aprender();
  }
  seleccion = null;
  guardar();
  ciclo();
}

function ciclo() {
  pintar();
  if (e.ganador !== null || iaTrabajando) return;
  if (quienDecide() === IA) {
    iaTrabajando = true;
    setTimeout(() => {
      iaTrabajando = false;
      if (e.ganador === null && quienDecide() === IA) hacer(elegirAccion(e));
    }, PAUSA_IA);
  } else if (e.pendiente) {
    abrirEleccion();
  } else if (e.pila.length && !e.pila.at(-1).cerrada) {
    abrirRespuesta();
  }
}

function accionesDe(uid, legales) {
  return legales.filter((a) => a.uid === uid || (a.portador === uid && a.tipo !== "jugar"));
}

function etiqueta(a) {
  switch (a.tipo) {
    case "oro": return "Poner como Oro";
    case "jugar": {
      const { pagar } = costeDe(e, YO, a.uid);
      const base = a.portador ? `Equipar a ${nombre(a.portador)}` : a.desde === "cementerio" ? "Jugar desde el Cementerio" : "Jugar";
      return `${base} · ${pagar} Oro${pagar === 1 ? "" : "s"}`;
    }
    case "habilidad": {
      const d = N.def(e, a.def);
      const h = d.activadas[a.h];
      const oros = h.oros ?? 0;
      return `${d.id !== e.instancias[a.uid] ? `(${d.nombre}) ` : ""}${h.texto ?? "Usar habilidad"}${oros ? ` · ${oros} Oro${oros > 1 ? "s" : ""}` : ""}`;
    }
    case "responder": return `Anular con ${nombre(a.uid)}`;
    case "atacar": return "Atacar";
    case "bloquear": return `Bloquear a ${nombre(a.atacante)}`;
    case "descartar": return "Descartar";
    default: return a.tipo;
  }
}

const GLOBALES = {
  quedarse: "Me quedo",
  mulligan: "Mulligan",
  mulliganGratis: "Mulligan gratis",
  batalla: "Atacar",
  terminar: "Fin de turno",
  finAtaque: "Listo",
  finBloqueo: "Listo",
  pasar: "Pasar",
};

function boton(texto, alClic, principal = false) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "boton" + (principal ? " principal" : "");
  b.textContent = texto;
  b.addEventListener("click", alClic);
  return b;
}

function elemento(uid) {
  let el = elementos.get(uid);
  if (!el) {
    el = document.createElement("button");
    el.type = "button";
    el.className = "carta";
    el.dataset.uid = uid;
    el.addEventListener("click", () => tocarCarta(uid));
    elementos.set(uid, el);
  }
  return el;
}

function vestir(el, uid, oculta, legales) {
  const c = N.carta(e, uid);
  const clave = oculta ? "dorso" : `${e.instancias[uid]}|${N.enJuego(e, uid) && c.tipo === "Aliado" ? N.fuerza(e, uid) : ""}|${e.conv[uid]?.tipo ?? ""}`;
  if (el.dataset.clave !== clave) {
    el.dataset.clave = clave;
    const portadas = el.querySelector(":scope > .portadas");
    el.replaceChildren();
    if (oculta) {
      el.append(Object.assign(document.createElement("span"), { className: "dorso" }));
      el.setAttribute("aria-label", "Carta oculta");
    } else {
      el.append(Object.assign(document.createElement("img"), { src: img(uid), alt: "", draggable: false }));
      el.setAttribute("aria-label", c.nombre);
      if (c.tipo === "Aliado" && N.enJuego(e, uid)) {
        const f = N.fuerza(e, uid);
        const base = c.fuerza ?? 0;
        el.append(Object.assign(document.createElement("span"), { className: "fz" + (f > base ? " sube" : f < base ? " baja" : ""), textContent: f }));
      }
      if (e.conv[uid]) el.append(Object.assign(document.createElement("span"), { className: "etiqueta", textContent: e.conv[uid].tipo === "Aliado" ? "Convertida" : "Oro" }));
    }
    if (portadas) el.append(portadas);
  }
  el.classList.toggle("puede", !oculta && accionesDe(uid, legales).length > 0);
  el.classList.toggle("elegida", seleccion === uid);
}

function pila(j, tipo) {
  const clave = `${j}-${tipo}`;
  if (!pilas[clave]) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = `pila ${tipo}`;
    b.addEventListener("click", () => verPila(j, tipo));
    pilas[clave] = b;
  }
  const b = pilas[clave];
  const lista = e.jugadores[j][tipo];
  const tope = tipo === "castillo" ? null : lista.at(-1);
  b.replaceChildren();
  if (tipo === "castillo" && lista.length) b.append(Object.assign(document.createElement("span"), { className: "dorso" }));
  if (tope) b.append(Object.assign(document.createElement("img"), { src: img(tope), alt: "" }));
  b.append(Object.assign(document.createElement("span"), { className: "nombre-pila", textContent: tipo === "castillo" ? "Castillo" : tipo === "cementerio" ? "Cementerio" : "Destierro" }));
  b.append(Object.assign(document.createElement("span"), { className: "cuenta", textContent: lista.length }));
  b.setAttribute("aria-label", `${tipo} ${j === YO ? "tuyo" : "de la IA"}: ${lista.length} cartas`);
  return b;
}

function zonaActual() {
  const z = new Map();
  for (const uid of Object.keys(e.instancias)) {
    const u = N.ubicar(e, uid);
    if (u) z.set(uid, u.zona === "arma" ? `${u.j}:arma` : `${u.j}:${u.zona}`);
  }
  for (const it of e.pila) z.set(it.uid, "escenario");
  for (const fr of e.cola) for (const p of fr.pasos) if (p.op === "finTalisman" && !z.has(p.uid)) z.set(p.uid, "escenario");
  return z;
}

function rectDePila(clave) {
  const [j, zona] = clave.split(":");
  const p = pilas[`${j}-${zona}`];
  return p?.isConnected ? p.getBoundingClientRect() : null;
}

function origenDe(uid) {
  const previa = zonaPrevia.get(uid) ?? `${N.dueno(uid)}:castillo`;
  const [, zona] = previa.split(":");
  if (PILAS.includes(zona)) return rectDePila(previa);
  if (previa === "escenario") return $("escenario").getBoundingClientRect();
  return null;
}

function volar(desde, hasta, uid, cara) {
  if (SIN_MOVIMIENTO || !desde || !hasta) return;
  const g = document.createElement("div");
  g.className = "carta fantasma";
  g.append(cara ? Object.assign(document.createElement("img"), { src: img(uid), alt: "" }) : Object.assign(document.createElement("span"), { className: "dorso" }));
  Object.assign(g.style, { left: `${desde.left}px`, top: `${desde.top}px`, width: `${desde.width}px` });
  document.body.append(g);
  const dx = hasta.left + hasta.width / 2 - (desde.left + desde.width / 2);
  const dy = hasta.top + hasta.height / 2 - (desde.top + desde.height / 2);
  const s = hasta.width / desde.width;
  g.animate([{ transform: "translate(0,0) scale(1)", opacity: 1 }, { transform: `translate(${dx}px, ${dy}px) scale(${s})`, opacity: 0.85 }], { duration: DURACION + 120, easing: "cubic-bezier(.3,.7,.3,1)" }).finished.then(() => g.remove(), () => g.remove());
}

function flotar(rect, texto) {
  if (!rect) return;
  const f = Object.assign(document.createElement("span"), { className: "flota", textContent: texto });
  Object.assign(f.style, { left: `${rect.left + rect.width / 2 - 14}px`, top: `${rect.top - 6}px` });
  document.body.append(f);
  setTimeout(() => f.remove(), 1200);
}

function pintarRecursos(j, legales) {
  const fila = $(`r-${j}`);
  const oros = document.createElement("div");
  oros.className = "oros";
  oros.append(Object.assign(document.createElement("span"), { className: "etq", textContent: "Reserva" }));
  const p = e.jugadores[j];
  const colocar = [];
  for (const u of p.reserva) colocar.push([u, oros, false]);
  oros.append(...p.reserva.map((u) => elemento(u)));
  oros.append(Object.assign(document.createElement("span"), { className: "sep" }), Object.assign(document.createElement("span"), { className: "etq", textContent: "Pagado" }));
  oros.append(...p.pagado.map((u) => elemento(u)));
  for (const u of p.pagado) colocar.push([u, oros, true]);
  const piezas = PILAS.map((t) => pila(j, t));
  fila.replaceChildren(...(j === YO ? [oros, ...piezas] : [...piezas, oros]));
  for (const [u, , pagado] of colocar) {
    const el = elemento(u);
    vestir(el, u, false, legales);
    el.classList.toggle("pagado", pagado);
  }
}

function pintar() {
  if (!e) return;
  const antes = new Map();
  for (const [uid, el] of elementos) if (el.isConnected) antes.set(uid, el.getBoundingClientRect());
  const castillosAntes = [0, 1].map((j) => Number(pilas[`${j}-castillo`]?.querySelector(".cuenta")?.textContent ?? NaN));
  const rectPilasAntes = new Map(Object.entries(pilas).map(([k, p]) => [k, p.isConnected ? p.getBoundingClientRect() : null]));

  const decido = e.ganador === null && quienDecide() === YO && !e.pendiente && !(e.pila.length && !e.pila.at(-1).cerrada);
  const legales = decido ? accionesLegales(e) : [];
  const visibles = new Set();

  for (const j of [0, 1]) {
    pintarRecursos(j, legales);
    for (const u of N.orosDe(e, j)) visibles.add(u);
    for (const zona of ["apoyo", "defensa", "ataque"]) {
      const cont = $(`z-${j}-${zona}`);
      const rotulo = cont.querySelector(".rotulo");
      const uids = e.jugadores[j][zona];
      const els = uids.map((u) => {
        visibles.add(u);
        const el = elemento(u);
        el.classList.remove("pagado");
        vestir(el, u, false, legales);
        const armas = e.armas[u] ?? [];
        let port = el.querySelector(":scope > .portadas");
        if (armas.length) {
          if (!port) { port = Object.assign(document.createElement("span"), { className: "portadas" }); el.append(port); }
          port.replaceChildren(...armas.map((a) => { visibles.add(a); const ea = elemento(a); vestir(ea, a, false, legales); ea.classList.remove("pagado"); return ea; }));
        } else if (port) port.remove();
        return el;
      });
      cont.replaceChildren(rotulo, ...els);
    }
    const mano = $(`z-${j}-mano`);
    const uids = e.jugadores[j].mano;
    const n = uids.length;
    mano.replaceChildren(...uids.map((u, i) => {
      visibles.add(u);
      const el = elemento(u);
      el.classList.remove("pagado");
      vestir(el, u, j === IA, legales);
      if (j === YO) {
        const t = n > 1 ? i / (n - 1) - 0.5 : 0;
        el.style.setProperty("--giro", `${t * Math.min(24, n * 3)}deg`);
        el.style.setProperty("--alza", `${Math.abs(t) * Math.min(14, n * 1.6)}px`);
        el.style.zIndex = String(i + 1);
      }
      return el;
    }));
  }

  const escenario = $("escenario");
  const enEscena = [...new Set([...e.pila.map((it) => it.uid), ...e.cola.flatMap((fr) => fr.pasos.filter((p) => p.op === "finTalisman").map((p) => p.uid))])].filter((u) => !N.ubicar(e, u));
  escenario.replaceChildren(...enEscena.map((u) => {
    visibles.add(u);
    const el = elemento(u);
    el.classList.remove("pagado");
    vestir(el, u, false, []);
    el.classList.toggle("anulada", !!e.pila.find((it) => it.uid === u)?.anulado);
    return el;
  }));

  const ahora = zonaActual();
  for (const [uid, el] of elementos) {
    if (visibles.has(uid)) continue;
    if (el.isConnected) {
      const destino = ahora.get(uid);
      const r = antes.get(uid);
      el.remove();
      if (destino && PILAS.includes(destino.split(":")[1])) volar(r, rectDePila(destino), uid, !el.querySelector(".dorso"));
    }
  }

  for (const [uid, zona] of ahora) {
    const previa = zonaPrevia.get(uid);
    if (!previa || previa === zona) continue;
    const [, zp] = previa.split(":");
    const [, za] = zona.split(":");
    if (PILAS.includes(zp) && PILAS.includes(za)) volar(rectPilasAntes.get(previa.replace(":", "-")) ?? rectDePila(previa), rectDePila(zona), uid, za !== "castillo");
  }

  if (!SIN_MOVIMIENTO) {
    for (const uid of visibles) {
      const el = elementos.get(uid);
      if (!el?.isConnected) continue;
      const despues = el.getBoundingClientRect();
      const a = antes.get(uid) ?? (zonaPrevia.size ? origenDe(uid) : null);
      if (!a || !despues.width) continue;
      const dx = a.left + a.width / 2 - (despues.left + despues.width / 2);
      const dy = a.top + a.height / 2 - (despues.top + despues.height / 2);
      const s = a.width / despues.width;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1 && Math.abs(s - 1) < 0.02) continue;
      el.animate([{ transform: `translate(${dx}px, ${dy}px) scale(${s})` }, { transform: "translate(0,0) scale(1)" }], { duration: DURACION, easing: "cubic-bezier(.25,.8,.3,1)" });
    }
  }

  for (const j of [0, 1]) {
    const ahoraC = e.jugadores[j].castillo.length;
    const perdidas = castillosAntes[j] - ahoraC;
    const robadas = [...ahora].filter(([u, z]) => zonaPrevia.get(u) === `${j}:castillo` && z === `${j}:mano`).length;
    if (perdidas - robadas > 0) {
      const p = pilas[`${j}-castillo`];
      flotar(p.getBoundingClientRect(), `−${perdidas - robadas}`);
      p.classList.remove("golpe");
      void p.offsetWidth;
      p.classList.add("golpe");
    }
  }
  zonaPrevia = ahora;

  $("fase").textContent = FASES[e.fase] ?? "…";
  $("turno").textContent = e.fase === "mulligan" ? "Antes de empezar" : `Turno ${e.turno + 1}`;
  const quien = $("quien");
  const mio = e.ganador === null && quienDecide() === YO;
  quien.textContent = e.ganador !== null ? (e.ganador === YO ? "¡Ganaste!" : "Gana la IA") : mio ? "Tu jugada" : "IA pensando";
  quien.classList.toggle("tuyo", mio);

  const acciones = $("acciones");
  acciones.replaceChildren();
  if (e.ganador !== null) acciones.append(boton("Otra partida", nuevaPartida, true));
  else if (e.pendiente && e.pendiente.jugador === YO) acciones.append(boton("Elegir", abrirEleccion, true));
  else if (decido) {
    for (const a of legales.filter((x) => GLOBALES[x.tipo])) acciones.append(boton(GLOBALES[a.tipo], () => hacer(a), ["terminar", "quedarse", "finAtaque", "finBloqueo", "pasar"].includes(a.tipo)));
  }
}

function tocarCarta(uid) {
  const u = N.ubicar(e, uid);
  if (u && u.j === IA && ["mano", "castillo"].includes(u.zona)) return;
  const decido = e.ganador === null && quienDecide() === YO && !e.pendiente && !(e.pila.length && !e.pila.at(-1).cerrada);
  abrirDetalle(uid, decido ? accionesLegales(e) : []);
}

function abrirHoja(contenido, cerrable = true) {
  $("hoja").replaceChildren(...contenido);
  $("hoja-fondo").hidden = false;
  $("hoja-fondo").onclick = cerrable ? (ev) => { if (ev.target === $("hoja-fondo")) cerrarHoja(); } : null;
}

function cerrarHoja() {
  $("hoja-fondo").hidden = true;
  if (seleccion) { seleccion = null; pintar(); }
}

function abrirDetalle(uid, legales) {
  seleccion = uid;
  const c = N.carta(e, uid);
  const u = N.ubicar(e, uid);
  const caja = document.createElement("div");
  caja.className = "detalle-carta";
  const i = Object.assign(document.createElement("img"), { src: img(uid, true), alt: c.nombre });
  const dl = document.createElement("dl");
  const fila = (k, v) => { if (v !== "" && v !== undefined && v !== null) dl.append(Object.assign(document.createElement("dt"), { textContent: k }), Object.assign(document.createElement("dd"), { textContent: v })); };
  fila("Tipo", c.tipo);
  if (c.tipo !== "Oro") fila("Coste", c.coste ?? 0);
  if (c.tipo === "Aliado" && N.enJuego(e, uid)) fila("Fuerza", `${N.fuerza(e, uid)}${N.fuerza(e, uid) !== (c.fuerza ?? 0) ? ` (base ${c.fuerza ?? 0})` : ""}`);
  if (N.enJuego(e, uid)) {
    fila("Claves", [...N.claves(e, uid)].filter((k) => CLAVES_VISIBLES.includes(k)).map((k) => NOMBRE_CLAVE[k] ?? k).join(", "));
    fila("Habilidad", N.activa(e, uid) ? "" : "Sin habilidad");
    fila("Armas", (e.armas[uid] ?? []).map(nombre).join(", "));
  }
  if (e.conv[uid]) fila("Convertida", e.conv[uid].tipo === "Aliado" ? `en Aliado de Fuerza ${e.conv[uid].fuerza ?? 0} sin habilidad` : "en Oro");
  fila("Zona", u ? `${u.j === YO ? "Tuya" : "IA"} · ${ZONAS[u.zona] ?? u.zona}` : "Jugándose");
  const texto = e.conv[uid]?.sinHabilidad ? "Sin habilidad mientras esté convertida." : c.texto || "Sin habilidad.";
  const lado = document.createElement("div");
  lado.append(dl, Object.assign(document.createElement("p"), { className: "texto-carta", textContent: texto }));
  caja.append(i, lado);
  const opciones = document.createElement("div");
  opciones.className = "opciones";
  for (const a of accionesDe(uid, legales)) opciones.append(boton(etiqueta(a), () => { $("hoja-fondo").hidden = true; hacer(a); }, true));
  const armasPara = legales.filter((a) => a.tipo === "jugar" && a.portador === uid);
  for (const a of armasPara) opciones.append(boton(`Equipar ${nombre(a.uid)} · ${costeDe(e, YO, a.uid).pagar} Oro`, () => { $("hoja-fondo").hidden = true; hacer(a); }));
  opciones.append(boton("Cerrar", cerrarHoja));
  abrirHoja([Object.assign(document.createElement("h2"), { textContent: c.nombre }), caja, opciones]);
  pintar();
}

function verPila(j, tipo) {
  const lista = e.jugadores[j][tipo];
  const titulo = Object.assign(document.createElement("h2"), { textContent: `${ZONAS[tipo]} ${j === YO ? "tuyo" : "de la IA"} · ${lista.length}` });
  const cont = document.createElement("div");
  cont.className = "opciones cartas";
  if (tipo !== "castillo") {
    for (const u of [...lista].reverse()) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "opcion-carta";
      b.append(Object.assign(document.createElement("img"), { src: img(u), alt: "" }), nombre(u));
      b.addEventListener("click", () => abrirDetalle(u, []));
      cont.append(b);
    }
  }
  const nota = tipo === "castillo" ? [Object.assign(document.createElement("p"), { className: "sub", textContent: "El Castillo es privado: quedan " + lista.length + " cartas. Pierdes si llega a 0." })] : [];
  abrirHoja([titulo, ...nota, cont, boton("Cerrar", cerrarHoja)]);
}

function verRegistro() {
  const r = document.createElement("div");
  r.className = "registro";
  r.append(...registro.slice(-120).map((x) => Object.assign(document.createElement("p"), { textContent: x.texto, className: x.clase })));
  abrirHoja([Object.assign(document.createElement("h2"), { textContent: "Registro" }), r, boton("Cerrar", cerrarHoja)]);
  r.lastElementChild?.scrollIntoView({ block: "end" });
}

function contextoEleccion() {
  const fr = e.cola[0];
  const fuente = fr?.ctx?.def ? N.def(e, fr.ctx.def).nombre : "";
  const op = e.pendiente.cont.op;
  const que = op === "sel" ? "Elige una carta" : op === "modo" ? "Elige un efecto" : op === "opcional" ? "¿Usar esta habilidad?" : op === "robarHasta" ? "¿Cuántas cartas robar?" : "Elige";
  return { fuente, que };
}

function abrirEleccion() {
  if (!e.pendiente || e.pendiente.jugador !== YO) return;
  const { fuente, que } = contextoEleccion();
  const opciones = e.pendiente.opciones;
  const sonCartas = opciones.some((o) => typeof o.valor === "string");
  const elegir = (i) => () => { $("hoja-fondo").hidden = true; hacer({ tipo: "elegir", i }); };
  const bloques = [];
  if (sonCartas) {
    const grupos = { [IA]: new Map(), [YO]: new Map() };
    opciones.forEach((o, i) => {
      if (typeof o.valor !== "string") return;
      const u = N.ubicar(e, o.valor);
      const j = u ? u.j : N.dueno(o.valor);
      const zona = u ? ZONAS[u.zona] ?? u.zona : "—";
      if (!grupos[j].has(zona)) grupos[j].set(zona, []);
      grupos[j].get(zona).push([o, i]);
    });
    for (const j of [IA, YO]) {
      if (!grupos[j].size) continue;
      const sec = document.createElement("section");
      sec.className = `grupo-eleccion ${j === YO ? "mias" : "rivales"}`;
      sec.append(Object.assign(document.createElement("h3"), { textContent: j === YO ? "Tuyas" : "De la IA" }));
      for (const [zona, items] of grupos[j]) {
        sec.append(Object.assign(document.createElement("p"), { className: "zona-eleccion", textContent: zona }));
        const lista = document.createElement("div");
        lista.className = "opciones cartas";
        for (const [o, i] of items) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "opcion-carta";
          b.append(Object.assign(document.createElement("img"), { src: img(o.valor), alt: "" }), nombre(o.valor));
          b.addEventListener("click", elegir(i));
          lista.append(b);
        }
        sec.append(lista);
      }
      bloques.push(sec);
    }
  }
  const botones = document.createElement("div");
  botones.className = "opciones";
  opciones.forEach((o, i) => {
    if (typeof o.valor === "string") return;
    const texto = o.texto && o.valor !== true ? o.texto : o.valor === true ? "Sí" : o.valor === false ? "No" : o.valor === null ? (sonCartas ? "Ninguna / listo" : "Listo") : `${o.valor}`;
    botones.append(boton(texto, elegir(i), o.valor !== null && o.valor !== false));
  });
  if (botones.children.length) bloques.push(botones);
  abrirHoja([Object.assign(document.createElement("h2"), { textContent: fuente || que }), Object.assign(document.createElement("p"), { className: "sub", textContent: fuente ? que : "" }), ...bloques], false);
}

function abrirRespuesta() {
  const top = e.pila.at(-1);
  const legales = accionesLegales(e);
  const caja = document.createElement("div");
  caja.className = "detalle-carta";
  caja.append(Object.assign(document.createElement("img"), { src: img(top.uid, true), alt: nombre(top.uid) }), Object.assign(document.createElement("p"), { className: "sub", textContent: `Coste ${top.coste}. Puedes Anularla ahora.` }));
  const opciones = document.createElement("div");
  opciones.className = "opciones";
  for (const a of legales.filter((x) => x.tipo === "responder")) opciones.append(boton(etiqueta(a), () => { $("hoja-fondo").hidden = true; hacer(a); }, true));
  opciones.append(boton("Dejar pasar", () => { $("hoja-fondo").hidden = true; hacer({ tipo: "noResponder" }); }));
  abrirHoja([Object.assign(document.createElement("h2"), { textContent: `La IA juega ${nombre(top.uid)}` }), caja, opciones], false);
}

function mostrarMesa(si) {
  $("portada").hidden = si;
  $("tablero").hidden = !si;
  document.body.classList.toggle("en-duelo", si);
  if (si && !e) {
    if (cargar()) ciclo();
    else nuevaPartida();
  }
}

$("nueva").addEventListener("click", () => {
  if (e?.ganador === null && !confirm("¿Abandonar esta partida y empezar otra?")) return;
  nuevaPartida();
});
$("ver-registro").addEventListener("click", verRegistro);
$("portada-crear").addEventListener("click", () => Cuenta.abrir("crear"));
$("portada-entrar").addEventListener("click", () => Cuenta.abrir("entrar"));
Cuenta.iniciar({ contenedor: $("nav-cuenta"), alSesion: (s) => mostrarMesa(!!s) });
</script>
